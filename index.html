<meta name="apple-mobile-web-app-capable" content="yes">
<title>Слова 2000</title>

<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--pri:#2563eb;--pri2:#1d4ed8;--ok:#16a34a;--bad:#dc2626;--line:#e2e8f0;--chip:#e8eefc}
@media(prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#162033;--ink:#e5ecf8;--mut:#94a3b8;--pri:#3b82f6;--pri2:#60a5fa;--ok:#22c55e;--bad:#f87171;--line:#26334a;--chip:#1e2b45}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));min-height:100vh}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pill{background:var(--chip);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#22c55e);width:0;transition:width .3s}
.stats{display:flex;gap:8px}
.stats div{flex:1;text-align:center;background:var(--chip);border-radius:14px;padding:10px 4px}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--mut)}
button{font:inherit;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;color:#fff;background:var(--pri);font-weight:600;width:100%;margin:6px 0}
button:active{transform:scale(.98)}
button.sec{background:var(--chip);color:var(--ink)}
button.ok{background:var(--ok)}button.bad{background:var(--bad)}
button:disabled{opacity:.45}
.row{display:flex;gap:10px}.row button{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{width:auto;padding:7px 11px;border-radius:99px;font-size:13px;margin:0;background:var(--chip);color:var(--ink)}
.chip.on{background:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;margin:14px 0;box-shadow:0 8px 28px rgba(37,99,235,.10);user-select:none}
.word{font-size:40px;font-weight:700;word-break:break-word}
.tr{font-size:28px;color:var(--pri2);margin-top:14px;font-weight:600}
.hint{color:var(--mut);font-size:14px;margin-top:18px}
.spk{width:auto;background:var(--chip);color:var(--ink);padding:8px 14px;border-radius:99px;margin-top:16px;font-size:15px}
.prog{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.back{width:auto;background:transparent;color:var(--pri2);padding:8px 4px;margin:0}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left;font-weight:500}
.opt.right{border-color:var(--ok);background:rgba(34,197,94,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(220,38,38,.12)}
input[type=search]{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.item b{font-size:16px}.item span{color:var(--mut);font-size:14px;text-align:right}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--line)}
.dot.s1{background:#f59e0b}.dot.s2{background:var(--ok)}
.big{font-size:46px;text-align:center;margin:10px 0}
.center{text-align:center}
label.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
</style>
</head>

т"],["sweat","пот"],["sword","меч"],["tablet","таблетка, планшет"],["tent","палатка"],["thief","вор"],["thread","нитка"],["throat","горло"],["thumb","большой палец"],["tide","прилив"],["toe","палец ноги"],["tongue","язык (орган)"],["towel","полотенце"],["toy","игрушка"],["tray","поднос"],["tribe","племя"],["trunk","ствол, багажник"],["tunnel","тоннель"],["twin","близнец"],["umbrella","зонт"],["wallet","кошелёк"],["wardrobe","шкаф для одежды"],["whale","кит"],["wheat","пшеница"],["wire","провод"],["witch","ведьма"],["wound","рана"],["yard","двор"],["zoo","зоопарк"],["internet","интернет"],["website","сайт"],["email","электронная почта"],["password","пароль"],["app","приложение"],["online","онлайн"],["click","кликать, щелчок"],["download","скачивать"],["keyboard","клавиатура"],["laptop","ноутбук"],["smartphone","смартфон"],["virtual","виртуальный"],["January","январь"],["February","февраль"],["March","март"],["April","апрель"],["May","май, мочь"],["June","июнь"],["July","июль"],["August","август"],["September","сентябрь"],["October","октябрь"],["November","ноябрь"],["December","декабрь"],["Monday","понедельник"],["Tuesday","вторник"],["Wednesday","среда"],["Thursday","четверг"],["Friday","пятница"],["Saturday","суббота"],["Sunday","воскресенье"],["north","север"],["south","юг"],["east","восток"],["west","запад"],["left","левый, налево"],["myself","я сам"],["yourself","ты сам"],["himself","он сам"],["herself","она сама"],["itself","само"],["ourselves","мы сами"],["themselves","они сами"],["tonight","сегодня вечером"],["anymore","больше не"],["anywhere","где угодно"],["whenever","всякий раз когда"],["wherever","где бы ни"],["whoever","кто бы ни"],["unless","если не"],["although","хотя"],["whereas","тогда как"],["hence","следовательно"],["beyond","за пределами"],["beside","рядом с"],["onto","на (с движением)"],["throughout","на протяжении"],["regarding","относительно"]];
const KEY='slova2000_v1',INT=[0,1,2,4,8,16,32],N=W.length;
const $=s=>document.querySelector(s),app=$('#app');
const DAY=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
let S=Object.assign({c:{},dir:'en',voice:true,log:{},start:0},load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function speak(t){if(!S.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
const learned=()=>Object.values(S.c).filter(c=>c.b>=4).length;
const dueIds=()=>{const d=DAY();return Object.keys(S.c).map(Number).filter(i=>S.c[i].d<=d).sort((a,b)=>S.c[a].b-S.c[b].b)};
function newIds(n){const out=[];for(let k=0;k<N&&out.length<n;k++){const i=(S.start+k)%N;if(!S.c[i])out.push(i)}return out}
function streak(){let d=DAY(),s=0;if(!S.log[d])d--;while(S.log[d]){s++;d--}return s}
function answer(i,ok){const c=S.c[i]||(S.c[i]={b:0,d:0});if(ok){c.b=Math.min(6,c.b+1);c.d=DAY()+INT[c.b]}else{c.b=0;c.d=DAY()}S.log[DAY()]=(S.log[DAY()]||0)+1;save()}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function home(){
  const L=learned(),seen=Object.keys(S.c).length,due=dueIds().length,lv=Math.ceil(N/100);
  app.innerHTML=`
  <div class="top"><div><h1>Слова 2000</h1><div class="sub">Английский, самые частые слова</div></div><div class="pill">🔥 ${streak()}</div></div>
  <div class="box"><div class="sub">Выучено ${L} из ${N}</div><div class="bar"><i style="width:${L/N*100}%"></i></div>
  <div class="stats"><div><b>${seen}</b><span>начато</span></div><div><b>${L}</b><span>выучено</span></div><div><b>${due}</b><span>повторить</span></div></div></div>
  <button id="bn">Новые слова (10)</button>
  <button id="br" class="sec" ${due?'':'disabled'}>Повторить (${Math.min(due,20)})</button>
  <button id="bq" class="sec">Тест на выбор</button>
  <button id="bl" class="sec">Все слова</button>
  <div class="box"><div class="sub">Начать новые слова с уровня (по 100 слов)</div><div class="chips">${Array.from({length:lv},(_,k)=>`<button class="chip ${S.start===k*100?'on':''}" data-l="${k}">${k+1}</button>`).join('')}</div></div>
  <div class="box">
  <label class="sw"><span>Показывать сначала: ${S.dir==='en'?'английский':'русский'}</span><button id="td" class="chip">Сменить</button></label>
  <label class="sw"><span>Озвучка ${S.voice?'включена':'выключена'}</span><button id="tv" class="chip">Сменить</button></label>
  <label class="sw"><span>Сбросить прогресс</span><button id="rs" class="chip">Сбросить</button></label></div>`;
  $('#bn').onclick=()=>study(newIds(10),'Новые слова');
  $('#br').onclick=()=>study(dueIds().slice(0,20),'Повторение');
  $('#bq').onclick=quiz;$('#bl').onclick=list;
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.start=+b.dataset.l*100;save();home()});
  $('#td').onclick=()=>{S.dir=S.dir==='en'?'ru':'en';save();home()};
  $('#tv').onclick=()=>{S.voice=!S.voice;save();home()};
  $('#rs').onclick=()=>{if(confirm('Удалить весь прогресс?')){S.c={};S.log={};save();home()}};
}

function study(ids,title){
  if(!ids.length){app.innerHTML=`<button class="back" id="b">← Назад</button><div class="box center"><div class="big">🎉</div>Здесь пока пусто. Загляните позже.</div>`;$('#b').onclick=home;return}
  let q=ids.slice(),done=0,total=ids.length,open=false;
  function view(){
    if(!q.length){app.innerHTML=`<div class="box center"><div class="big">✅</div><h1>Готово!</h1><div class="sub">Пройдено слов: ${total}</div></div><button id="b">На главную</button>`;$('#b').onclick=home;return}
    const i=q[0],[en,ru]=W[i],front=S.dir==='en'?en:ru,back=S.dir==='en'?ru:en;
    app.innerHTML=`<div class="prog"><button class="back" id="b">← Назад</button><span>${title}: ${done}/${total}</span></div>
    <div class="bar"><i style="width:${done/total*100}%"></i></div>
    <div class="card" id="cd"><div class="word">${esc(front)}</div>${open?`<div class="tr">${esc(back)}</div>`:`<div class="hint">Нажмите, чтобы увидеть перевод</div>`}<button class="spk" id="sp">🔊 Произнести</button></div>
    ${open?`<div class="row"><button class="bad" id="no">Не знаю</button><button class="ok" id="yes">Знаю</button></div>`:`<button id="sh">Показать перевод</button>`}`;
    $('#b').onclick=home;
    $('#sp').onclick=e=>{e.stopPropagation();speak(en)};
    const reveal=()=>{open=true;view();if(S.dir==='ru')speak(en)};
    if(!open){$('#cd').onclick=reveal;$('#sh').onclick=reveal;if(S.dir==='en')speak(en)}
    else{$('#no').onclick=()=>next(false);$('#yes').onclick=()=>next(true)}
  }
  function next(ok){const i=q.shift();answer(i,ok);if(ok)done++;else q.splice(Math.min(3,q.length),0,i);open=false;view()}
  view();
}

function quiz(){
  let pool=Object.keys(S.c).map(Number);if(pool.length<10)pool=pool.concat(newIds(10-pool.length+5));
  const ids=shuffle(pool).slice(0,10);let k=0,score=0;
  function view(){
    if(k>=ids.length){app.innerHTML=`<div class="box center"><div class="big">${score>=8?'🏆':score>=5?'👍':'💪'}</div><h1>${score} из ${ids.length}</h1></div><button id="a">Ещё раз</button><button id="b" class="sec">На главную</button>`;$('#a').onclick=quiz;$('#b').onclick=home;return}
    const i=ids[k],[en,ru]=W[i];let opts=[i];while(opts.length<4){const j=Math.random()*N|0;if(!opts.includes(j)&&W[j][1]!==ru)opts.push(j)}
    opts=shuffle(opts);
    app.innerHTML=`<div class="prog"><button class="back" id="b">← Назад</button><span>${k+1}/${ids.length}</span></div>
    <div class="card" style="min-height:170px"><div class="word">${esc(en)}</div><button class="spk" id="sp">🔊</button></div>
    ${opts.map(j=>`<button class="opt" data-j="${j}">${esc(W[j][1])}</button>`).join('')}`;
    $('#b').onclick=home;$('#sp').onclick=()=>speak(en);speak(en);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.j===i;document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===i)x.classList.add('right')});
      if(!ok)b.classList.add('wrong');else score++;
      if(S.c[i]||ok)answer(i,ok);setTimeout(()=>{k++;view()},ok?600:1400)});
  }
  view();
}

function list(){
  app.innerHTML=`<div class="prog"><button class="back" id="b">← Назад</button><span>${N} слов</span></div><input type="search" id="q" placeholder="Поиск по слову или переводу"><div class="box" id="l" style="padding:4px 12px"></div>`;
  $('#b').onclick=home;
  const draw=()=>{const t=$('#q').value.trim().toLowerCase();let h='',n=0;
    for(let i=0;i<N&&n<300;i++){const [en,ru]=W[i];if(t&&!en.toLowerCase().includes(t)&&!ru.toLowerCase().includes(t))continue;n++;
      const c=S.c[i],st=!c?'':c.b>=4?'s2':'s1';h+=`<div class="item" data-w="${esc(en)}"><b><i class="dot ${st}"></i>${esc(en)}</b><span>${esc(ru)}</span></div>`}
    $('#l').innerHTML=h||'<div class="sub" style="padding:12px">Ничего не найдено</div>';
    document.querySelectorAll('.item').forEach(e=>e.onclick=()=>speak(e.dataset.w))};
  $('#q').oninput=draw;draw();
}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const a=$('#sh')||$('#yes');if(e.key===' '||e.key==='Enter'){const b=$('#sh');if(b){e.preventDefault();b.click()}}
  if(e.key==='ArrowRight'&&$('#yes'))$('#yes').click();if(e.key==='ArrowLeft'&&$('#no'))$('#no').click()});
home();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
